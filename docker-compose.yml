version: "3.8"
services:
  traefik:
    image: traefik:v2.11
    command: --api.insecure=true --providers.docker
    ports: ["80:80","443:443","8080:8080"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  meilisearch:
    image: getmeili/meilisearch:v1.7
    ports: ["7701:7700"]
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  chroma:
    image: chromadb/chroma:latest
    ports: ["8001:8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  prometheus:
    image: prom/prometheus:v2.47
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
  grafana:
    image: grafana/grafana:10.2
    ports: ["3000:3000"]
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-storage:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-zqm_void_admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  grafana-storage:
