name: Supply Chain Security Scan
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install scanner
        run: pip install requests
      - name: Download scanner
        run: |
          python -c "import urllib.request; urllib.request.urlretrieve('https://raw.githubusercontent.com/ZQM-Labs/zqm-supply-chain-scanner/main/snyk_replacement.py', 'snyk_replacement.py')"
      - name: Run scan
        run: |
          python snyk_replacement.py             --repo ${{ github.repository }}             --output both             --pr ${{ github.event.pull_request.number || 0 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set timestamp
        id: timestamp
        run: echo "timestamp=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"
      - name: Locate scanner SARIF
        id: scan-sarif
        run: |
          mkdir -p ".zqm-security-reports/${{ github.repository }}"
          SCAN_SARIF=$(find ".zqm-security-reports/${{ github.repository }}" -maxdepth 1 -name '*-results.sarif' | sort | tail -n 1 || true)
          if [ -z "$SCAN_SARIF" ]; then
            echo '{"version":"2.1.0","runs":[]}' > ".zqm-security-reports/${{ github.repository }}/empty-results.sarif"
            SCAN_SARIF=".zqm-security-reports/${{ github.repository }}/empty-results.sarif"
          fi
          echo "path=$SCAN_SARIF" >> "$GITHUB_OUTPUT"
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.scan-sarif.outputs.path }}
        if: |
          always() && hashFiles(steps.scan-sarif.outputs.path) != ''
      - name: Upload findings artifact
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-scan-${{ github.run_id }}
          path: .zqm-security-reports/${{ github.repository }}/
          retention-days: 30
        if: always()
