name: package

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/**
          retention-days: 30
