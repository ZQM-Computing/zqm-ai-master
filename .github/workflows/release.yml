name: package

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/build_release.py
      - name: Build Windows service package
        run: powershell -File scripts/install_service.ps1 -InstallDir dist\install
      - uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: |
            dist/**
            dist/install/**
          retention-days: 30
