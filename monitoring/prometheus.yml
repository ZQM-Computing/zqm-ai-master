global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "zqm-void-n4"
    node: "N4"

scrape_configs:
  - job_name: "void"
    metrics_path: "/api/observability/metrics"
    static_configs:
      - targets: ["host.docker.internal:8808"]
        labels:
          node: "N4"
          service: "void"

  - job_name: "cadvisor"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8082"]
        labels:
          node: "N4"
          service: "cadvisor"

  - job_name: "node-exporter"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          node: "N4"
          service: "node"

  - job_name: "rag-bot"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8600"]
        labels:
          node: "N4"
          service: "rag-bot"
