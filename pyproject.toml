[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zqm-ai-master"
version = "0.1.0"
description = "Void AI orchestration and RAG benchmark harness"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.4",
    "pytest>=8.3,<9.0",
    "passlib>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
prod = [
    "absl-py>=2.5.0",
    "aiohttp>=3.14.3",
    "datasets>=5.0.1",
    "transformers>=5.14.1",
    "tiktoken>=0.13.0",
    "lm_eval>=0.4.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
ignore = ["Python", "pythoncore-3.14-64", "samples", "data"]

[project.urls]
Homepage = "https://github.com/ZQM-Labs/zqm-ai-master"
Repository = "https://github.com/ZQM-Labs/zqm-ai-master.git"

[project.scripts]
zqm-ai-master = "cli:main"
